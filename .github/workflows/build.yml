name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 runner 预装的 Android SDK。
      # 不用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而该包已被 Google 下架，必然报 "Failed to find package 'tools'"。
      - name: 安装 Android SDK 组件
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 构建 APK
        run: bash build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

  # 说明：
  #   CI 使用临时生成的密钥签名，仅用于验证代码可编译并产出可审阅的包。
  #   正式发布包请在本机用你自己的 key.jks 构建，否则用户无法覆盖升级。
  #   若要让 CI 产出正式包，把 key.jks 转 base64 存入 Secrets，
  #   在构建前解码成文件并通过 KEYSTORE 环境变量指向它即可。
